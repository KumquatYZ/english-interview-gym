# EngTraining · app 配置（改这里即可切换模型/驱动，无需动代码）
server:
  host: 127.0.0.1
  port: 8765

llm:
  # 【必填】你的 OpenAI 兼容接口地址（也可用环境变量 API_BASE_URL 覆盖）
  # 例如：https://api.deepseek.com/v1 、https://open.bigmodel.cn/api/paas/v4
  base_url: ""
  model: deepseek/deepseek-flash        # 按服务商提供的模型 ID 填写
  fallback_models:
    - deepseek/deepseek-v4-flash-0731
    - kimi-k3
  disable_thinking: true   # 关闭思考链：更快、更省 token，且避免"思考草稿被当正文泄漏"（模型不支持时会自动去掉该参数）
  temperature: 0.6
  timeout_s: 120

asr:
  driver: auto            # auto | cloud | local（auto：云端可用则云端，否则本地）
  endpoint: ""            # 【可选】云端 ASR 接口地址；留空自动使用本地模式
  model: ""               # 云端识别模型名（按服务商文档填写）
  fallback_models: []     # 云端备用模型（可选）
  source: en              # 识别的基准语种（缺省自动检测）
  # 本地兜底（mlx-whisper）。想更准可把 local_model 换成 mlx-community/whisper-large-v3-turbo（下载约 1.6G）
  local_model: mlx-community/whisper-small-mlx
  local_fallback_model: mlx-community/whisper-tiny
  timeout_s: 180

tts:
  driver: cloud           # cloud | macos_say（云端失败自动退回 say）
  say_voice: Samantha     # 兜底音色（say -v '?' 查看）
  say_rate: 170
  endpoint: ""            # 【可选】云端 TTS 接口地址；留空自动使用 say
  cloud_model: ""         # 云端合成模型名（按服务商文档填写）
  cloud_voice_id: ""      # 默认音色
  voices:                 # 按考官人格分配音色（示例为常见英文音色名，按你的服务商调整）
    hr-friendly: English_Graceful_Lady
    tech-lead: English_Trustworth_Man
    stress: English_ManWithDeepVoice
    meeting-host: English_ConfidentWoman
  cache: true

tools:
  ffmpeg: ffmpeg            # ffmpeg 可执行文件；不在 PATH 时改为绝对路径

review:                     # 收藏夹「今日复习」（每天按比例随机温故）
  ratio: 0.3                # 每日复习词数 = 收藏单词总量 × 该比例（0.05–1.0）
  min_per_day: 5            # 每日最少复习词数
  max_per_day: 30           # 每日最多复习词数

session:
  max_answer_seconds: 120   # 单次作答上限（秒）
  followup_max: 1           # 每个主问题最多几个追问
  daily_goal_minutes: 20    # 每日开口目标（打卡面板进度环）

paths:
  data_dir: data
  materials_dir: materials
