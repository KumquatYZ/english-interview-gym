# 题目整理自互联网公开渠道（社区面经 / 公开面试题等），收录时已做通用化改写；
# 仅供个人学习交流，如涉侵权请联系仓库 Issues，将立即下架。
key: mnc-60
title: 外企面试 60 题（商务英语 · 全流程编排）
note: >
  按外企面试流程定制（HR 初面 → 直属主管 → 技术面 → 跨部门/终面）：行为面用 STAR 五类桶（领导力/团队/冲突/失败/压力），
  商务英语覆盖状态同步、向上沟通、跨团队协作，技术面覆盖研究项目深挖的常见角度。
  命题依据：外企药企 / 工业软件 / 材料半导体等方向的公开面经与常见岗位要求。
  使用建议：先「技术面试官 + 自由说」跑 2–3 次，再做一次全英文 HR 初面；每题可先点开「答题思路」，读一遍示范答案后自己说。
questions:
  # ============ A. 开场与自我介绍 ============
  - id: a01
    round: HR 初面
    category: 开场与自我介绍
    text: "Tell me about yourself."
    intent: 破冰并定基调；面试官用 90 秒判断要不要往下聊。
    hint: 像聊天一样介绍自己，不要念简历——① 一句身份（专业方向 + 阶段）；② 用一两句人话讲清你研究的是什么问题、为什么重要：先说「用 X 和 Y 解决什么问题」，不要上来就报模型名、数据集名；③ 说你平时用什么工具和方法解决专业问题（具体工具是加分项）；④ 挑一个亮点用能被听懂的话说，数字最多留一个；⑤ 收一句「为什么是这家公司」。100–150 词，通俗优先，宁少术语、不堆术语。
    followups:
      - "What's the one thing you want me to remember about you?"
      - "Why should we remember you among this year's PhD candidates?"
  - id: a02
    round: HR 初面
    category: 开场与自我介绍
    text: "Walk me through your resume, and highlight what's most relevant to this role."
    intent: 考察你能否为岗位做优先级判断，而不是流水账。
    hint: 先想清楚岗位最需要什么，从简历里挑 2–3 个最对得上的点讲——每个点说清「我做了什么、怎么做的、结果如何」，结果能说人话就别报数字（最多一处）；其余一句带过。面试官在看你会不会为岗位做优先级判断、讲得清不清楚，而不是听流水账或术语轰炸。
    followups:
      - "Which of these projects are you most proud of, and why?"
  - id: a03
    round: HR 初面
    category: 开场与自我介绍
    text: "Why are you moving from academia to industry, and why now?"
    intent: 动机真实性；排查「逃避学术」型候选人。
    hint: 讲真实的吸引力：行业里有真实数据和闭环验证、有工程资源、能把方法做成产品而不只是论文；「为什么是现在」要有具体理由。避免吐槽学术圈或空喊热爱，也别说「就是想赚钱」。
    followups:
      - "What would you miss about academia?"
      - "What if your first year is more engineering than science?"
  - id: a04
    round: HR 初面
    category: 开场与自我介绍
    text: "What kind of role are you looking for?"
    intent: 判断岗位匹配度与期望管理。
    hint: 一句话给出目标岗位画像（方向、偏建模还是偏工程），再说明你不排斥另一侧的工作。避免「什么都可以」——面试官在判断人岗匹配和你对自己的了解。
    followups:
      - "What do you NOT want to do?"

  # ============ B. 动机与匹配 ============
  - id: b01
    round: HR / 主管
    category: 动机与匹配
    text: "Why our company?"
    intent: 经典送命题；考你有没有做功课、匹配是否真实。
    hint: 提前查好这家公司：讲一个具体事实（产品、平台、开源工具或近期新闻，要能说出名字），接着说它和你的交叉点、你能带来的增量。泛泛夸「行业领导者」是减分项；说出细节能赢过大多数候选人。
    followups:
      - "What do you know about our work?"
      - "Who else are you interviewing with?"
  - id: b02
    round: 主管 / 技术面
    category: 动机与匹配
    text: "Why this role specifically — why AI for drug discovery (or materials)?"
    intent: 方向承诺度；会不会干半年就跑。
    hint: 说清楚你的技能在真实场景里的价值——怎么「接地」到用户或业务结果；再表达长期深耕的意愿，可引用一个你了解的案例。面试官在防「干半年就跑」，承诺要具体。
    followups:
      - "What would make you leave in two years?"
  - id: b03
    round: 主管面
    category: 动机与匹配
    text: "Why should we hire you? What makes you different from other PhD candidates?"
    intent: 差异化与自我推销能力（外企非常看重）。
    hint: 差异化要落在组合优势上，比如「算法能力 × 领域理解 × 工程落地」，每条配一个项目证据和数字。别只说「学习能力强」——让证据替你说话。
    followups:
      - "That sounds strong. What's your weakness then?"
  - id: b04
    round: HR / 主管
    category: 动机与匹配
    text: "What do you know about our recent work — pipeline, platform, or products?"
    intent: 调研深度测试；外企面试几乎必问。
    hint: 面试前必做功课：官网 News、近半年的产品与发布、开源工具、代表文章，挑一个具体事实加一个你真想深入的问题。答不出细节是硬伤。
    followups:
      - "Which of our products would you most want to work on, and why?"
  - id: b05
    round: HR 初面
    category: 动机与匹配
    text: "Would you be open to relocation or business travel? Any constraints?"
    intent: 现实条件确认（外企常有全球协作和差旅）。
    hint: 如实说明对出差、外派、时区协作的开放度与边界；有国际协作或英语工作经历就拿出来佐证。态度干脆，条件有边界就直说。
    followups:
      - "Are you comfortable working with teams in European or US time zones?"
  - id: b06
    round: HR / 主管
    category: 动机与匹配
    text: "What are you most proud of in your PhD so far?"
    intent: 价值观测试：你在意的是发表还是闭环落地？
    hint: 挑一个「从零开始、最后能用」的项目：起点、你做了什么、结果（数字或真实使用）。面试官在判断你在意的是完成度还是过程。
    followups:
      - "How much of it was your own idea?"
  - id: b07
    round: HR / 主管
    category: 动机与匹配
    text: "Why did you cross into AI, rather than staying pure lab work or pure theory?"
    intent: 职业叙事是否自洽。
    hint: 用一条转折线讲清职业叙事：之前做什么、什么事件让你转向、「为什么是现在」。叙事要自洽、可信，别把转行讲成逃离。
    followups:
      - "What part of hands-on work do you miss?"
  - id: b08
    round: 主管 / 终面
    category: 动机与匹配
    text: "What would you like to accomplish in your first year with us?"
    intent: 期望管理 + 成熟度。
    hint: 别给空泛的宏图：前 30 / 60 / 90 天各给一个具体动作和交付物，把节奏绑到对方团队的实际场景上。准备「怎么衡量第一年成功」。
    followups:
      - "How would you measure whether your first year went well?"

  # ============ C. 行为面（STAR） ============
  - id: c01
    round: 主管 / 终面
    category: 行为面·STAR
    text: "Tell me about a time you led a project from idea to a deliverable."
    intent: 领导力与ownership。
    hint: 讲一个你真的主导过的项目：你发起的部分、做过的关键决策、协调过的人、最终交付；结果给数字，背景一句带过。别把一半时间花在铺垫上。
    followups:
      - "What would you do differently if you ran it again?"
  - id: c02
    round: 主管面
    category: 行为面·STAR
    text: "Tell me about a time you worked in a cross-functional or interdisciplinary team."
    intent: 跨学科协作（工业界核心能力）。
    hint: 讲一次多工种协作：不同背景的人怎么对齐节奏和术语，你具体做了什么。面试官想听「术语不通、节奏不同」时的实际做法，不是「我们沟通很好」。
    followups:
      - "How did you resolve disagreements between workstreams?"
  - id: c03
    round: 主管面
    category: 行为面·STAR
    text: "Describe a time you had a disagreement with a colleague or advisor. How did you handle it?"
    intent: 冲突处理；看你会不会用数据说话、给对方台阶。
    hint: 挑一个真实的工作分歧：分歧点、你做了什么验证或沟通、怎么达成共识、关系有没有保住。别答「我很少和人吵架」——面试官要看你处理分歧的方式。
    followups:
      - "What if the data had supported THEIR view?"
  - id: c04
    round: 主管 / 终面
    category: 行为面·STAR
    text: "Tell me about a project that failed or didn't go as planned. What did you learn?"
    intent: 自我认知与成长性；真诚度测试。
    hint: 选一个真实的失败：你怎么止损、归因、换路径、后来怎么预防。避免「我太追求完美」这类伪缺点；真诚和复盘深度才是考点。
    followups:
      - "How do you decide when to kill a line of work?"
  - id: c05
    round: 主管面
    category: 行为面·STAR
    text: "Tell me about a time you worked under a tight deadline. How did you manage it?"
    intent: 压力下的执行与优先级。
    hint: 讲一次真实的冲刺：不可商量项是什么、砍了什么、怎么同步预期、结果如何按时交付。面试官会追问「砍范围时你怎么决定」。
    followups:
      - "What did you cut, and how did you decide?"
  - id: c06
    round: 主管面
    category: 行为面·STAR
    text: "Tell me about a time you had to learn something completely new, fast."
    intent: 学习能力与自驱。
    hint: 挑一个真的从零上手的技能：怎么学（资料、复现、拆解）、多快上手、产出什么。要具体到「多久、做出了什么」，别只说你学得快。
    followups:
      - "How do you decide what to learn next?"
  - id: c07
    round: 主管面
    category: 行为面·STAR
    text: "Tell me about a time you took initiative beyond your assigned responsibilities."
    intent: 主动性；工业界最看重信号之一。
    hint: 讲一件「没人要求你做、但你做了」的事：动机、过程、量化结果或他人受益。主动性是面试官最看重的信号之一，把「超出职责」这一点说清楚。
    followups:
      - "Did you ask permission first? How did people react?"
  - id: c08
    round: 主管 / 终面
    category: 行为面·STAR
    text: "Tell me about a time you received difficult feedback. How did you respond?"
    intent: 可教练性（coachability）。
    hint: 讲一次真实的批评（导师、同事、客户）：对方的意思、你的第一反应、具体行动、结果改善。可教练性（coachability）是考点——先承认再行动，别辩解。
    followups:
      - "What's the harshest thing someone said about your work?"
  - id: c09
    round: 主管面
    category: 行为面·STAR
    text: "Tell me about a time you had to make a decision with incomplete data."
    intent: 判断力与风险意识。
    hint: 讲一次信息不全时的决策：你依据什么做判断、怎么控制风险、事后怎么验证。面试官在看你的判断框架和风险意识，不是运气。
    followups:
      - "How do you guard against your own bias in those decisions?"
  - id: c10
    round: 主管 / 终面
    category: 行为面·STAR
    text: "Tell me about a time you influenced someone without formal authority."
    intent: 影响力与沟通。
    hint: 讲一次你说服别人的经历：对方最初的顾虑、你拿出的证据、最终有没有采纳、收益是什么。证据要落在「对方真的改变了做法」上。
    followups:
      - "What do you do when you can't convince them?"
  - id: c11
    round: 主管面
    category: 行为面·STAR
    text: "Tell me about a time you had to juggle multiple competing priorities."
    intent: 时间管理与沟通。
    hint: 讲多任务并行的真实场景：你的排序标准（重要性、依赖方、截止时间）、怎么和上级对齐、放弃了什么。准备「你对什么说了不」。
    followups:
      - "What did you say no to?"
  - id: c12
    round: 主管面
    category: 行为面·STAR
    text: "Tell me about a time you dealt with unclear requirements or ambiguity."
    intent: 在模糊中推进的能力（工业界常态）。
    hint: 讲一件需求不清的事：你怎么低成本对齐（草案、假设清单、快速确认）、怎么迭代。展示你「把模糊变具体」的方法，别说成「我问了很多问题」。
    followups:
      - "How do you avoid over-asking and slowing things down?"
  - id: c13
    round: HR / 主管
    category: 行为面·STAR
    text: "Tell me about a time you collaborated across cultures or time zones."
    intent: 外企必备：跨文化协作。
    hint: 讲一次跨文化或跨时区协作的具体细节：语言、习惯、节奏差异怎么处理过去的。这题是在核对你能不能和全球团队一起干活。
    followups:
      - "How comfortable are you presenting in English to a group?"
  - id: c14
    round: 主管面
    category: 行为面·STAR
    text: "Tell me about a mistake you made that affected others, and what you did about it."
    intent: 诚信与补救能力。
    hint: 讲一个影响过他人的真实错误：第一时间怎么处理、怎么补救、建了什么机制防复发。关键在「不藏」——面试官在测诚信。
    followups:
      - "What mechanism did you put in place afterwards?"
  - id: c15
    round: HR / 主管
    category: 行为面·STAR
    text: "Tell me about a time you mentored, taught, or onboarded someone."
    intent: 团队价值与分享精神。
    hint: 讲一次你带人或教人的经历：你怎么把复杂的事讲明白、对方进步的迹象。面试官想听你的方法和耐心，不是头衔。
    followups:
      - "How do you explain complex ideas to beginners?"

  # ============ D. 技术面·研究深挖 ============
  - id: d01
    round: 技术面
    category: 技术面·研究深挖
    text: "Walk me through your PhD research in three minutes. Assume I know the technical background."
    intent: 科研叙事与优先级（技术专家面前）。
    hint: 把你的研究讲成三条线，每条一句核心结果（问题、方法、数字），细节留给对方追问。技术专家面前讲优先级，不要按时间顺序复述。
    followups:
      - "What was the hardest technical bottleneck?"
      - "Which result are you least confident about?"
  - id: d02
    round: 技术面 / 终面
    category: 技术面·研究深挖
    text: "Now explain the same research to a business audience in 60 seconds."
    intent: 面向非专家的价值翻译能力。
    hint: 用商业语言讲同一份工作：问题、方案、价值（时间、成本、成功率）；一个类比就够，别讲术语。考的是你能不能和非技术的人对话。
    followups:
      - "If I were a commercial lead, why would I fund this?"
  - id: d03
    round: 技术面
    category: 技术面·研究深挖
    text: "Why did you choose your main model architecture — instead of classical baselines or standard descriptors?"
    intent: 方法选择的科学判断力。
    hint: 方法选择讲三个理由：为什么它适合这个问题的本质、保留了什么关键信息、数据规模与泛化能力；最后拿一个对比数字收尾，并准备好被追问失败模式。
    followups:
      - "What are the failure modes of your model?"
      - "How would it compare to diffusion-based docking approaches?"
  - id: d04
    round: 技术面
    category: 技术面·研究深挖
    text: "How did you validate your models — and where do they still fail?"
    intent: 严谨性；承认局限的勇气。
    hint: 讲验证链路：怎么划分数据、有没有独立验证、外推测试怎么做。主动说局限和失败类型是加分项——藏着等对方挖出来是减分项。
    followups:
      - "How do you know the model isn't just memorizing the training set?"
  - id: d05
    round: 技术面
    category: 技术面·研究深挖
    text: "Your inverse-design workflow uses LLM agents. How exactly do the agents work, and where do they break?"
    intent: agent 工程的理解深度（对方可能是 agent/RAG 团队）。
    hint: 讲清流程和边界：每一步在做什么、谁来把关、哪里会出错、你怎么防。主动讲失败模式和缓解措施，比只讲成功更可信。
    followups:
      - "How did you evaluate the reliability of the agents?"
      - "What safeguards against hallucination did you build in?"
  - id: d06
    round: 技术面
    category: 技术面·研究深挖
    text: "You curated a large domain dataset from scratch. What was the hardest part of that dataset work?"
    intent: 数据工程能力（工业界最缺）。
    hint: 讲数据工作里最难的部分：一致性、去重、标签质量、体系异质性，以及你的规则、留痕和质检流程。面试官要听工程感，不是「数据很干净」。
    followups:
      - "How would you scale that curation process to 100k+ complexes?"
  - id: d07
    round: 技术面 / 终面
    category: 技术面·研究深挖
    text: "You worked on a confidential industrial project. How do you talk about it in an interview?"
    intent: 合规意识 + 沟通边界（外企特别敏感）。
    hint: 先讲性质与边界（哪些能讲、哪些不能），再把能讲的讲到方法论层；明确说明细节需要合规前提。体现「懂规矩、不神秘化」。
    followups:
      - "If we hired you, how would you handle confidentiality across teams you work with?"
  - id: d08
    round: 技术面 / 主管
    category: 技术面·研究深挖
    text: "If you joined us to work on AIDD (or materials AI), how would your experience transfer — and what would you need to learn?"
    intent: 迁移能力与自我认知。
    hint: 分开讲「能迁移的」（方法、思维、流程）和「要学的」（领域数据特性、流程、平台）。具体的「要学清单」反而加分，别说得像什么都会。
    followups:
      - "What's the first thing you'd study in your first month?"
  - id: d09
    round: 技术面
    category: 技术面·研究深挖
    text: "Which recent papers, models, or tools in your field impressed you most, and why?"
    intent: 领域嗅觉与好奇心（防「只会自己的题」）。
    hint: 准备 2–3 个近两年的项目或工具，每个一句「为什么重要 + 和你的关系」。别只举人人都说的例子——这题测领域嗅觉和好奇心。
    followups:
      - "If you could implement one of them here, which and how?"
  - id: d10
    round: 技术面
    category: 技术面·研究深挖
    text: "What's a technical decision from your PhD you would redo if you could?"
    intent: 反思深度与工程成熟度。
    hint: 选一个真实的技术遗憾：当时为什么那样选、现在怎么看、会怎么改。反思深度是考点，别挑无关痛痒的。
    followups:
      - "How do you make those calls earlier now?"
  - id: d11
    round: 技术面
    category: 技术面·研究深挖
    text: "How do you make a model interpretable? You used SHAP — why does interpretability matter in industrial R&D?"
    intent: 可解释性意识（药企/材料企业刚需）。
    hint: 讲一个你让模型「可解释」的具体做法，以及它怎么改变了别人的决策（信任、采信、下一步实验）。可解释性在工业界是刚需，要落到实际价值。
    followups:
      - "When does interpretability matter more than accuracy?"
  - id: d12
    round: 技术面
    category: 技术面·研究深挖
    text: "How do you keep your work reproducible and well-engineered — code, data, pipelines?"
    intent: 工程素养（外企 P 序列核心要求）。
    hint: 报硬货：代码仓库、版本管理、脚本化流程、环境复现；再诚实补一个你正在养的工程习惯。工程素养是这题的全部考点，别只讲理念。
    followups:
      - "What engineering practice are you weakest in, honestly?"

  # ============ E. 商务英语与职场沟通 ============
  - id: e01
    round: 主管 / 终面
    category: 商务英语·职场沟通
    text: "Give me a 90-second status update on your current project, as if I were a non-technical stakeholder."
    intent: 结论先行的商务沟通（外企日常）。
    hint: 结论先行：先说状态（绿黄红）、一句关键进展、风险、需要的支持。练 bottom line first，别按时间顺序讲；把对方当非技术高管。
    followups:
      - "And what do you need from me as your sponsor?"
  - id: e02
    round: 主管面
    category: 商务英语·职场沟通
    text: "How would you tell a project lead that your modeling work will slip by two weeks?"
    intent: 坏消息的沟通方式：早、准、带方案。
    hint: 坏消息的讲法：早说、影响评估、原因一句、补救选项、新时间线承诺；对事不对人。准备「你什么时候说出来」的追问。
    followups:
      - "When would you raise it — a week before, or the day you know?"
  - id: e03
    round: 主管 / 终面
    category: 商务英语·职场沟通
    text: "You strongly disagree with a senior scientist's technical choice. How do you raise it?"
    intent: 向上管理与得体表达（外企文化特别看重）。
    hint: 私下先说、先理解对方的假设、用数据或小实验说话、给替代方案而非只说不行；被否后执行并留记录。展示你分得清原则问题和偏好问题。
    followups:
      - "What if they overrule you and it fails?"
  - id: e04
    round: 主管面
    category: 商务英语·职场沟通
    text: "Your manager gives you a vague instruction. What do you do next?"
    intent: 主动性 + 向上管理。
    hint: 先复述确认目标与成功标准，列 2–3 个执行选项让对方挑，约定短周期 check-in。既不要沉默硬猜，也不要问个不停。
    followups:
      - "How do you know when you have asked enough questions?"
  - id: e05
    round: 终面
    category: 商务英语·职场沟通
    text: "How would you present your PhD work to our commercial team — in their language?"
    intent: 价值翻译 + 商业嗅觉。
    hint: 讲成本、时间、风险、成功率，不讲算法；准备 30 秒和 3 分钟两个版本。对方会追问「什么绝不能说，免得过度承诺」。
    followups:
      - "What would you NOT tell them to avoid overpromising?"
  - id: e06
    round: HR / 主管
    category: 商务英语·职场沟通
    text: "Tell me about your written English at work — give me an example of something you wrote."
    intent: 英文书面沟通能力核实。
    hint: 给实际证据：写过的文档、邮件、报告、公开文本，说明你的写作流程。别说考试分数——现在的工作语言就是英语。
    followups:
      - "How do you handle writing when a deadline is tight?"
  - id: e07
    round: 主管面
    category: 商务英语·职场沟通
    text: "You need support from a busy team that doesn't report to you. How do you get it?"
    intent: 跨团队协作的影响力。
    hint: 先想对方的 KPI 与收益，把请求切小、给清晰输入和截止时间，主动回报成果。讲一个你实际这样拿到支持的例子；准备优先级冲突的追问。
    followups:
      - "What if your priorities conflict with theirs?"
  - id: e08
    round: 主管面
    category: 商务英语·职场沟通
    text: "How do you run a meeting or drive a technical discussion in English?"
    intent: 会议主持与推进能力（外企会议文化）。
    hint: 会前定议程目标、会中时间盒、用提问带动沉默者、结束前复述结论和待办。这题考「把讨论收敛到决定」的能力。
    followups:
      - "How do you keep a meeting from going off track?"
  - id: e09
    round: 主管面
    category: 商务英语·职场沟通
    text: "How do you give constructive feedback to a peer?"
    intent: 团队成熟度。
    hint: 私下、具体、对事不对人：观察、影响、建议、听对方视角；举一个真实例子，并准备「对方防御性强怎么办」。
    followups:
      - "What if they react defensively?"

  # ============ F. 情景题 ============
  - id: f01
    round: 主管 / 终面
    category: 情景题
    text: "What would your first 90 days look like in this role?"
    intent: 计划性与务实度。
    hint: 前 30 / 60 / 90 天各给一个具体动作和交付物，绑到对方团队的实际场景；别给宏大叙事，准备「第一天没有明确项目怎么办」。
    followups:
      - "What would you do if there were no clear project for you on day one?"
  - id: f02
    round: 主管 / 终面
    category: 情景题
    text: "You discover a data-integrity issue in a dataset you already reported on. What do you do?"
    intent: 诚信红线测试（外企必考）。
    hint: 顺序：评估影响面、尽早透明上报、修正并验证、通知受影响方、上机制防复发。核心一句话：数据诚信优先于面子。
    followups:
      - "Who do you tell first — your manager or the affected team?"
  - id: f03
    round: 主管面
    category: 情景题
    text: "You have two urgent deadlines and one team — how do you prioritize?"
    intent: 优先级框架与沟通。
    hint: 判断维度：影响大小、是否不可逆、能否并行或委派；主动找干系人对齐，而不是自己猜；对延后项给出预告。准备向上沟通取舍的说法。
    followups:
      - "How do you communicate the trade-off upward?"
  - id: f04
    round: 主管面
    category: 情景题
    text: "A critical collaborator stops responding mid-project. What do you do?"
    intent: 主动推进与关系处理。
    hint: 给空间后换渠道、自查自己的阻塞、到约定时间点走升级路径（先商量再升级）。别说「等对方回复」——这题考主动性。
    followups:
      - "When is escalation the right move?"
  - id: f05
    round: 终面
    category: 情景题
    text: "You're asked to deliver something you've never done before — say, deploy a model to production — in two weeks. How do you approach it?"
    intent: 学习速度 + 务实交付。
    hint: 先定义「可用」（demo 还是生产级）、找最短路径、设里程碑与降级方案、同步风险。展示你分得清完美和按时；准备「故意不做什么」。
    followups:
      - "What would you deliberately not do in those two weeks?"
  - id: f06
    round: 技术面 / 终面
    category: 情景题
    text: "With a limited GPU budget, how do you decide between two promising modeling directions?"
    intent: 资源决策与实验设计思维。
    hint: 用小成本实验先看信号、提前定判据、设时间盒、快速止损。讲一个你实际做过的取舍；准备「怎么防沉没成本思维」。
    followups:
      - "How do you avoid sunk-cost thinking?"

  # ============ G. 收尾与谈判 ============
  - id: g01
    round: HR 初面 / 终面
    category: 收尾与谈判
    text: "What are your strengths and weaknesses?"
    intent: 自知之明 + 包装能力。
    hint: 优势两条带证据；弱点一条真实但不致命，配正在做的改进动作。别用「我太追求完美」，也别把优势堆成形容词。
    followups:
      - "Give me an example of that weakness in action."
  - id: g02
    round: HR / 终面
    category: 收尾与谈判
    text: "Where do you see yourself in five years?"
    intent: 留任可能性与野心（外企常给双通道：管理/专家）。
    hint: 说清你想走技术线还是管理线（或双轨），以及为什么是这家公司的体系。别答「想当管理层」或「还没想过」。
    followups:
      - "Do you see yourself as a manager or an individual contributor?"
  - id: g03
    round: HR 初面 / 终面
    category: 收尾与谈判
    text: "What are your salary expectations?"
    intent: 定薪谈判；先回答「区间 + 依据 + 灵活度」。
    hint: 先给做过功课的区间（说清依据），说明构成、表示可谈；别第一个报底价，也别说「都可以」。
    followups:
      - "What's the minimum you would consider?"
      - "Do you have competing offers?"
  - id: g04
    round: 任何一轮
    category: 收尾与谈判
    text: "Do you have any questions for us?"
    intent: 反向考察你的专业度。
    hint: 准备 5 个问题现场挑 2–3 个：团队最大挑战、岗位成功标准、资源条件、技术栈与文化、流程下一步。别问官网能查到的。
    followups:
      - "Anything else you want to know about the team?"
  - id: g05
    round: 终面
    category: 收尾与谈判
    text: "Is there anything else we should know about you?"
    intent: 最后加分位。
    hint: 30 秒补一发差异化加诚意：你最想让对方记住的一点，以及为什么非这家不可；重申兴趣和时间线。
    followups:
      - "Anything you want to correct from earlier in this interview?"
  - id: g06
    round: HR 初面
    category: 收尾与谈判
    text: "When can you start, given your graduation timeline?"
    intent: 时间线匹配；也考你会不会主动谈「过渡期安排」。
    hint: 明确毕业与可入职时间，给出弹性安排（实习、提前参与、转全职），守住自己的底线要求。考的是时间线匹配和主动性。
    followups:
      - "Could you start part-time or as an intern before graduation?"
