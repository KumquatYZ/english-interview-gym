name: Build packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller packaging/EnglishInterviewGym.spec --distpath dist --workpath build_win --noconfirm

      - name: Assemble package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
          Copy-Item packaging/README-Windows.txt dist/EnglishInterviewGym/
          Copy-Item packaging/FFMPEG-NOTICE.txt dist/EnglishInterviewGym/
          Compress-Archive -Path dist/EnglishInterviewGym -DestinationPath "EnglishInterviewGym-$ver-win64.zip"
          Get-ChildItem *.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: EnglishInterviewGym-win64
          path: EnglishInterviewGym-*-win64.zip
          retention-days: 30

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller packaging/EnglishInterviewGym.spec --distpath dist --workpath build_mac --noconfirm

      - name: Harden runtime layout (no framework dir / no symlink)
        run: |
          cd dist/EnglishInterviewGym/_internal
          if [ -L Python ]; then t="$(readlink Python)"; rm Python; cp "$t" Python; chmod 755 Python; echo "dereferenced Python -> real file"; fi
          rm -rf Python.framework
          test ! -L Python
          test ! -e Python.framework
          [ -e Python ] || ls libpython3.*.dylib >/dev/null 2>&1 || { echo "FATAL: no python runtime found"; exit 1; }
          echo "python runtime present:"
          ls -la Python 2>/dev/null || true
          ls -la libpython3.*.dylib 2>/dev/null || true
          echo "runtime layout hardened"

      - name: Assemble package (preserve exec bits via ditto)
        run: |
          VER="${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
          cp packaging/README-macOS.txt packaging/FFMPEG-NOTICE.txt dist/EnglishInterviewGym/
          cp packaging/启动.command dist/EnglishInterviewGym/
          chmod +x dist/EnglishInterviewGym/启动.command dist/EnglishInterviewGym/EnglishInterviewGym
          ditto -c -k --sequesterRsrc --keepParent dist/EnglishInterviewGym "EnglishInterviewGym-${VER}-macos.zip"
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EnglishInterviewGym-macos
          path: EnglishInterviewGym-*-macos.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
